<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>GIA AR Solver — POC cámara</title>
    <style>
      :root {
        --bg: #0d1117;
        --panel: #161b22;
        --ink: #e6edf3;
        --muted: #8b949e;
        --accent: #2f81f7;
        --ok: #3fb950;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--ink);
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
        min-height: 100vh;
      }
      header {
        padding: 12px 16px;
        display: flex;
        align-items: baseline;
        gap: 12px;
        border-bottom: 1px solid #21262d;
      }
      header h1 { font-size: 16px; margin: 0; }
      header span { color: var(--muted); font-size: 12px; }
      main {
        display: grid;
        gap: 12px;
        padding: 12px 16px;
        max-width: 1100px;
        margin: 0 auto;
      }
      .controls { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
      button {
        background: var(--accent);
        color: white;
        border: 0;
        border-radius: 8px;
        padding: 10px 16px;
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
      }
      button.secondary { background: #21262d; color: var(--ink); }
      button:disabled { opacity: 0.5; cursor: default; }
      #hud {
        font-size: 12px;
        color: var(--muted);
        font-variant-numeric: tabular-nums;
      }
      .stage {
        position: relative;
        width: 100%;
        border-radius: 12px;
        overflow: hidden;
        background: var(--panel);
      }
      #camera {
        display: block;
        width: 100%;
        height: auto;
        background: #000;
      }
      #overlay {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
      }
      .row { display: grid; grid-template-columns: 2fr 1fr; gap: 12px; }
      @media (max-width: 720px) { .row { grid-template-columns: 1fr; } }
      .panel {
        background: var(--panel);
        border-radius: 12px;
        padding: 10px;
      }
      .panel h2 { font-size: 12px; margin: 0 0 8px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; }
      #rectified { display: block; width: 100%; height: auto; border-radius: 6px; background: #000; }
      #msg {
        font-size: 13px;
        color: var(--ink);
        background: var(--panel);
        border-radius: 8px;
        padding: 10px 12px;
        display: none;
      }
      #msg.error { display: block; color: #f85149; }
      footer {
        padding: 12px 16px;
        color: var(--muted);
        font-size: 11px;
        text-align: center;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>GIA AR Solver</h1>
      <span>POC cámara → detección de pantalla → rectificación (MVP-1)</span>
    </header>
    <main>
      <div class="controls">
        <button id="start">Iniciar cámara</button>
        <button id="stop" class="secondary" disabled>Detener</button>
        <button id="flip" class="secondary" disabled>Cambiar cámara</button>
        <span id="hud">—</span>
      </div>
      <div id="msg"></div>
      <div class="stage">
        <video id="camera" playsinline muted></video>
        <canvas id="overlay"></canvas>
      </div>
      <div class="row">
        <div class="panel">
          <h2>Pantalla rectificada (espacio del solver)</h2>
          <canvas id="rectified" width="320" height="200"></canvas>
        </div>
        <div class="panel">
          <h2>Estado</h2>
          <div id="state">Cámara detenida.</div>
        </div>
      </div>
    </main>
    <footer>
      Procesamiento 100 % local: ningún fotograma sale del dispositivo.
    </footer>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
