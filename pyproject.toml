[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gia-ar-solver"
version = "0.1.0"
description = "Real-time solver for GIA-style aptitude test questions with AR answer overlay"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "Arturo Ramírez" }]
dependencies = [
    "numpy>=1.26",
    "opencv-python>=4.10",
    "pillow>=10.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
